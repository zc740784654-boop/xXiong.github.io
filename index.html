<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熊传芝</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --ink:#24304b; --purple:#7165c8; --pink:#f3a9c5; --mint:#8fd9c2; --glass:rgba(255,255,255,.91); }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(ellipse at 15% 15%,rgba(255,255,255,.62),transparent 27%),
      radial-gradient(ellipse at 85% 22%,rgba(255,220,239,.65),transparent 28%),
      linear-gradient(145deg,#8ec5d8 0%,#a9d9c2 42%,#d7c4ec 100%);
    padding:22px; color:var(--ink); overflow-x:hidden;
  }
  body:before, body:after { content:""; position:fixed; z-index:-1; pointer-events:none; border-radius:50%; filter:blur(2px); }
  body:before { width:340px;height:340px;left:-100px;bottom:-150px;background:rgba(255,255,255,.25); }
  body:after { width:420px;height:420px;right:-150px;top:-180px;background:rgba(255,255,255,.2); }
  .view { display:none; width:100%; }
  .view.active { display:block; }
  .card {
    background:var(--glass); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.7);
    border-radius:26px; padding:30px; max-width:500px; width:100%; margin:auto;
    text-align:center; box-shadow:0 22px 60px rgba(44,57,91,.2);
  }
  #view-home .card { max-width:560px; padding:34px 32px; }
  .avatar {
    width:104px;height:104px;border-radius:32px; margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;font-size:58px;
    background:linear-gradient(145deg,#fff3f8,#d9d1ff);border:4px solid white;
    box-shadow:0 8px 24px rgba(95,78,157,.2); transform:rotate(-4deg);
  }
  h1 { font-size:26px;color:#28304b;margin-bottom:7px; }
  .subtitle { color:#777b98;font-size:14px;margin-bottom:18px; }
  .intro { color:#59617b;font-size:15px;line-height:1.8;margin-bottom:22px; }
  .section-label { color:#8589a4;font-size:12px;letter-spacing:2px;margin:20px 0 10px;font-weight:700; }
  .games,.links,.mt,.settings-row { display:flex;gap:10px;justify-content:center;flex-wrap:wrap; }
  .btn {
    border:0;cursor:pointer;font-size:14px;padding:11px 18px;border-radius:999px;
    background:linear-gradient(135deg,#7669cf,#9a78d3);color:#fff;font-family:inherit;
    transition:transform .16s,box-shadow .16s;box-shadow:0 5px 14px rgba(116,101,198,.18);
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover { transform:translateY(-2px);box-shadow:0 9px 18px rgba(116,101,198,.25); }
  .btn.ghost { background:#fff;color:#6e65b7;border:1px solid #d9d4f2;box-shadow:none; }
  .btn.small { padding:8px 13px;font-size:13px; }
  .btn:disabled { opacity:.5;cursor:not-allowed;transform:none; }
  .links a { text-decoration:none;color:#6e65b7;border:1px solid #d9d4f2;background:#fff;padding:8px 17px;border-radius:999px;font-size:13px;transition:all .2s; }
  .links a:hover { background:#7669cf;color:#fff; }
  .game-head { display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px; }
  .game-head .title { font-weight:700;color:#333a59;font-size:16px;white-space:nowrap; }
  .score { color:#7669cf;font-weight:700;font-size:14px;white-space:nowrap; }
  canvas { display:block;margin:0 auto;background:#172238;border:5px solid #fff;border-radius:14px;box-shadow:0 8px 22px rgba(30,40,70,.18);touch-action:none; }
  #snake-canvas { width:min(100%,340px);height:auto; }
  #tetris-canvas { width:min(100%,220px);height:auto; }
  .hint { font-size:13px;color:#8589a4;margin:14px 0;line-height:1.7; }
  .pad { display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:0 auto; }
  .pad button { padding:13px 0;border:0;border-radius:11px;background:#eeedf8;color:#555276;font-size:18px;cursor:pointer;font-family:inherit;user-select:none; }
  .pad button:active { background:#dcd7f4;transform:scale(.97); }
  .pad .wide { grid-column:span 3;font-size:15px; }
  .mt { margin-top:16px; }
  .toolbar { display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0 4px; }
  .panel { background:rgba(245,244,255,.8);border:1px solid #e5e1f5;border-radius:16px;padding:13px;margin-top:16px; }
  .panel select,.panel input { accent-color:#7669cf; }
  .panel select { border:1px solid #d9d4f2;border-radius:9px;padding:7px 10px;background:white;color:#454565;font:inherit; }
  .stats { display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px; }
  .stat { background:#f4f2fc;border-radius:13px;padding:11px 5px; }
  .stat b { display:block;color:#6e65b7;font-size:19px; }
  .stat span { color:#8589a4;font-size:11px; }
  .tipline { color:#9698ae;font-size:11px;margin-top:18px; }
  @media(max-width:520px) { body{padding:12px}.card{padding:22px 15px;border-radius:20px}#view-home .card{padding:27px 18px}.game-head .title{font-size:14px}.btn{padding:10px 14px} }

  .fish-layout { display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;margin-top:12px; }
  .fish-panel { background:#f4f3fc;border:1px solid #e3def5;border-radius:15px;padding:13px; }
  .fish-panel h3 { font-size:14px;color:#555276;margin-bottom:9px; }
  .fish-big { font-size:48px;text-align:center;padding:12px 0;filter:drop-shadow(0 4px 8px rgba(60,50,100,.18)); }
  .fish-status { text-align:center;color:#747896;font-size:13px;min-height:40px;line-height:1.6; }
  .fish-actions { display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px; }
  .fish-actions .btn { min-width:100px; }
  .fish-meter { height:9px;background:#e4e2ef;border-radius:99px;overflow:hidden;margin:7px 0; }
  .fish-meter span { display:block;height:100%;background:linear-gradient(90deg,#83d7bd,#776bd0);width:50%;transition:width .2s; }
  .fish-list { display:flex;gap:7px;flex-wrap:wrap; }
  .fish-chip { border-radius:10px;background:white;padding:7px 9px;font-size:12px;color:#5f6080;border:1px solid #e5e1f2; }
  .fish-chip b { color:#7165c8; }
  .fish-log { height:94px;overflow:auto;background:#fff;border-radius:10px;padding:8px;font-size:12px;line-height:1.65;color:#73748d; }
  .fish-select { width:100%;padding:8px;border:1px solid #d9d4f2;border-radius:9px;background:white;color:#555276;font:inherit;font-size:13px;margin-bottom:7px; }
  .rarity-common { color:#7d8798 }.rarity-uncommon { color:#3b9b70 }.rarity-rare { color:#3977c9 }.rarity-epic { color:#9162c5 }.rarity-legend { color:#c18a25 }
  @media(max-width:520px){.fish-layout{grid-template-columns:1fr}.fish-big{font-size:42px}}

.fishing-host{max-width:1200px!important;width:100%;padding:12px!important}.fishing-frame{display:block;width:100%;height:calc(100vh - 100px);min-height:760px;border:0;border-radius:16px;background:#d9f7f0}@media(max-width:760px){.fishing-host{padding:6px!important}.fishing-frame{height:calc(100vh - 90px);min-height:820px;border-radius:12px}}
</style>
</head>
<body>

<!-- ========== 主页 ========== -->
<div id="view-home" class="view active">
  <div class="card">
    <div class="avatar" aria-label="幽灵伙伴头像">👻</div>
    <h1>熊传芝</h1>
    <p class="subtitle">游戏爱好者 · 前端探索者 · 小小开发者</p>
    <p class="intro">欢迎来到我的小小游戏基地！<br>这里收录了我制作的小游戏，祝你玩得开心 ✨</p>
    <div class="section-label">🎮 选择一款小游戏</div>
    <div class="games">
      <button class="btn" data-game="snake">🐍 贪吃蛇</button>
      <button class="btn" data-game="tetris">🧱 俄罗斯方块</button>
      <button class="btn" data-game="fishing">🎣 斗鱼大陆</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="best-snake">0</b><span>贪吃蛇纪录</span></div>
      <div class="stat"><b id="best-tetris">0</b><span>方块最高分</span></div>
      <div class="stat"><b id="played-count">0</b><span>游戏启动次数</span></div>
    </div>
    <div class="panel">
      <div class="section-label" style="margin-top:0">⚙️ 游戏设置</div>
      <div class="settings-row">
        <button class="btn small ghost" id="music-toggle">♫ 开启音乐</button>
        <button class="btn small ghost" id="sound-toggle">🔊 音效：开</button>
        <label style="font-size:13px;color:#777b98;display:flex;align-items:center;gap:7px">难度
          <select id="difficulty"><option value="easy">轻松</option><option value="normal" selected>普通</option><option value="hard">挑战</option></select>
        </label>
      </div>
    </div>
    <div class="section-label">🔗 我的空间</div>
    <div class="links">
      <a href="https://github.com/zc740784654-boop/" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:you@example.com">邮箱</a>
    </div>
    <p class="tipline">音乐由浏览器实时合成 · 首次播放请点击“开启音乐”</p>
  </div>
</div>

<!-- ========== 贪吃蛇 ========== -->
<div id="view-snake" class="view">
  <div class="card">
    <div class="game-head">
      <button class="btn ghost" data-back>← 返回</button>
      <span class="title">🐍 贪吃蛇</span>
      <span class="score">得分 <b id="snake-score">0</b></span>
    </div>
    <canvas id="snake-canvas" width="400" height="400"></canvas>
    <p class="hint">电脑：方向键 / WASD 控制方向<br>手机：点下方按钮</p>
    <div class="pad">
      <span></span>
      <button data-dir="up">↑</button>
      <span></span>
      <button data-dir="left">←</button>
      <button data-dir="down">↓</button>
      <button data-dir="right">→</button>
    </div>
    <div class="toolbar"><button class="btn small ghost" id="snake-pause">⏸ 暂停</button><button class="btn small" id="snake-restart">重新开始</button></div>
  </div>
</div>

<!-- ========== 俄罗斯方块 ========== -->
<div id="view-tetris" class="view">
  <div class="card">
    <div class="game-head">
      <button class="btn ghost" data-back>← 返回</button>
      <span class="title">🧱 俄罗斯方块</span>
      <span class="score">得分 <b id="tetris-score">0</b></span>
    </div>
    <canvas id="tetris-canvas" width="240" height="480"></canvas>
    <p class="hint">← → 移动 · ↑ 旋转 · ↓ 加速 · 空格 直接落下</p>
    <div class="pad">
      <button data-t="left">←</button>
      <button data-t="rotate">⟳</button>
      <button data-t="right">→</button>
      <button data-t="down">↓</button>
      <button data-t="drop" class="wide">⤓ 直接落下</button>
    </div>
    <div class="toolbar"><button class="btn small ghost" id="tetris-pause">⏸ 暂停</button><button class="btn small" id="tetris-restart">重新开始</button></div>
  </div>
</div>

<script>
/* ================= 音乐与音效（Web Audio 实时合成，无需外部音频文件） ================= */
const AudioBox = (() => {
  let ctx = null, master = null, musicOn = false, soundOn = true, melodyTimer = null, note = 0;
  const melody = [523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,659.25,783.99,1046.5,880,783.99,659.25,587.33];
  function init() {
    if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = .22; master.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
  }
  function tone(freq, duration=.12, type='sine', volume=.12, when=0) {
    if (!ctx) return;
    const t = ctx.currentTime + when, osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq,t);
    gain.gain.setValueAtTime(.0001,t); gain.gain.exponentialRampToValueAtTime(volume,t+.012);
    gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
    osc.connect(gain); gain.connect(master); osc.start(t); osc.stop(t+duration+.02);
  }
  function sfx(kind) {
    if (!soundOn) return; init();
    if (kind==='eat') { tone(660,.09,'sine',.16); tone(880,.13,'sine',.13,.08); }
    else if (kind==='move') tone(260,.035,'square',.035);
    else if (kind==='drop') { tone(180,.1,'triangle',.12); tone(110,.12,'triangle',.08,.07); }
    else if (kind==='clear') [523,659,784,1047].forEach((f,i)=>tone(f,.18,'sine',.12,i*.07));
    else if (kind==='over') [392,330,262,196].forEach((f,i)=>tone(f,.22,'triangle',.1,i*.16));
    else if (kind==='click') tone(740,.055,'sine',.07);
  }
  function startMusic() {
    init(); if (musicOn) return; musicOn=true; note=0;
    const play = () => { if (!musicOn) return; tone(melody[note%melody.length],.27,'sine',.045); if (note%4===0) tone(melody[note%melody.length]/2,.32,'triangle',.025); note++; };
    play(); melodyTimer=setInterval(play,310);
    document.getElementById('music-toggle').textContent='♫ 关闭音乐';
  }
  function stopMusic() { musicOn=false; clearInterval(melodyTimer); melodyTimer=null; const b=document.getElementById('music-toggle'); if(b)b.textContent='♫ 开启音乐'; }
  function toggleMusic() { musicOn ? stopMusic() : startMusic(); }
  function toggleSound() { soundOn=!soundOn; document.getElementById('sound-toggle').textContent='🔊 音效：'+(soundOn?'开':'关'); }
  return { sfx,toggleMusic,toggleSound,get musicOn(){return musicOn;} };
})();
const Records = {
  get(k){ return Number(localStorage.getItem('mini-'+k)||0); },
  set(k,v){ if(v>this.get(k)) localStorage.setItem('mini-'+k,String(v)); this.refresh(); },
  played(){ localStorage.setItem('mini-played',String(this.get('played')+1)); this.refresh(); },
  refresh(){
    const a=document.getElementById('best-snake'),b=document.getElementById('best-tetris'),c=document.getElementById('played-count');
    if(a)a.textContent=this.get('snake'); if(b)b.textContent=this.get('tetris'); if(c)c.textContent=this.get('played');
  }
};

/* ================= 贪吃蛇 ================= */
const Snake = (() => {
  const canvas = document.getElementById('snake-canvas');
  const ctx = canvas.getContext('2d');
  const N = 20;
  const CELL = canvas.width / N;
  const scoreEl = document.getElementById('snake-score');

  let snake, dir, nextDir, food, score, timer, over, paused=false;

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    over = false; paused=false;
    const pauseBtn=document.getElementById('snake-pause'); if(pauseBtn)pauseBtn.textContent='⏸ 暂停';
    scoreEl.textContent = '0';
    placeFood();
    clearInterval(timer);
    timer = setInterval(step, gameSpeed(130));
    draw();
  }

  function placeFood() {
    let ok = false;
    while (!ok) {
      food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
      ok = !snake.some(s => s.x === food.x && s.y === food.y);
    }
  }

  function step() {
    if (over || paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      over = true;
      Records.set('snake',score); AudioBox.sfx('over');
      clearInterval(timer);
      draw();
      return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score; AudioBox.sfx('eat');
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(255,255,255,.04)';
    for (let i = 1; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // 食物
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // 蛇
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#9ae6b4' : '#4ade80';
      roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 4);
      ctx.fill();
    });

    if (over) {
      ctx.fillStyle = 'rgba(0,0,0,.65)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '16px sans-serif';
      ctx.fillText('得分 ' + score, canvas.width / 2, canvas.height / 2 + 24);
    }
  }

  function turn(nx, ny) {
    if (over) return;
    if (nx === -dir.x && ny === -dir.y) return; // 不能直接掉头
    nextDir = { x: nx, y: ny };
  }

  function key(e) {
    const k = e.key.toLowerCase();
    let handled = true;
    if (k === 'arrowup' || k === 'w') turn(0, -1);
    else if (k === 'arrowdown' || k === 's') turn(0, 1);
    else if (k === 'arrowleft' || k === 'a') turn(-1, 0);
    else if (k === 'arrowright' || k === 'd') turn(1, 0);
    else if (k === 'r') reset();
    else handled = false;
    if (handled) e.preventDefault();
  }

  return {
    start() { reset(); },
    stop()  { clearInterval(timer); },
    pause() { paused=!paused; document.getElementById('snake-pause').textContent=paused?'▶ 继续':'⏸ 暂停'; },
    reset, key, turn
  };
})();

document.querySelectorAll('[data-dir]').forEach(b => {

    if (d === 'down')  Snake.turn(0, 1);
    if (d === 'left')  Snake.turn(-1, 0);
    if (d === 'right') Snake.turn(1, 0);

});

  const scoreEl = document.getElementById('tetris-score');

  const PIECES = [
    { shape: [[1,1,1,1]],          color: '#4dd0e1' }, // I
    { shape: [[1,1],[1,1]],        color: '#ffd54f' }, // O
    { shape: [[0,1,0],[1,1,1]],    color: '#ba68c8' }, // T
    { shape: [[0,1,1],[1,1,0]],    color: '#81c784' }, // S
    { shape: [[1,1,0],[0,1,1]],    color: '#e57373' }, // Z
    { shape: [[1,0,0],[1,1,1]],    color: '#64b5f6' }, // J
    { shape: [[0,0,1],[1,1,1]],    color: '#ffb74d' }  // L
  ];

  let board, piece, score, lines, level, over, paused, timer;

  function newBoard() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  }

  function speed() {
    return Math.max(140, 600 - (level - 1) * 55);
  }

  function schedule() {
    clearInterval(timer);
    timer = setInterval(tick, gameSpeed(speed()));
  }

  function reset() {
    board = newBoard();
    score = 0; lines = 0; level = 1;
    over = false; paused = false;
    const pauseBtn=document.getElementById('tetris-pause'); if(pauseBtn)pauseBtn.textContent='⏸ 暂停';
    scoreEl.textContent = '0';
    spawn();
    schedule();
    draw();
  }

  function spawn() {
    const p = PIECES[Math.floor(Math.random() * PIECES.length)];
    piece = {
      shape: p.shape.map(r => r.slice()),
      color: p.color,
      x: Math.floor((COLS - p.shape[0].length) / 2),
      y: 0
    };
    if (collide(piece.shape, piece.x, piece.y)) {
      over = true; Records.set('tetris',score); AudioBox.sfx('over');
      clearInterval(timer);
    }
  }

  function collide(shape, px, py) {
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (!shape[r][c]) continue;
        const x = px + c, y = py + r;
        if (x < 0 || x >= COLS || y >= ROWS) return true;
        if (y >= 0 && board[y][x]) return true;
      }
    }
    return false;
  }

  function merge() {
    piece.shape.forEach((row, r) => row.forEach((v, c) => {
      if (v) {
        const y = piece.y + r, x = piece.x + c;
        if (y >= 0) board[y][x] = piece.color;
      }
    }));
  }

  function clearLines() {
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r].every(v => v)) {
        board.splice(r, 1);
        board.unshift(Array(COLS).fill(0));
        cleared++;
        r++; // 重新检查同一行
      }
    }
    if (cleared) {
      const pts = [0, 100, 300, 500, 800][cleared] || 800;
      score += pts;
      lines += cleared;
      const nl = Math.floor(lines / 10) + 1;
      if (nl > level) { level = nl; schedule(); }
      scoreEl.textContent = score;
      AudioBox.sfx('clear');
    }
  }

  function tick() {
    if (over || paused) return;
    if (!collide(piece.shape, piece.x, piece.y + 1)) {
      piece.y++;
    } else {
      merge(); clearLines(); spawn();
    }
    draw();
  }

  function move(dx) {
    if (over || paused) return;
    if (!collide(piece.shape, piece.x + dx, piece.y)) {
      piece.x += dx;
      draw();
    }
  }

  function softDrop() {
    if (over || paused) return;
    if (!collide(piece.shape, piece.x, piece.y + 1)) {
      piece.y++;
    } else {
      merge(); clearLines(); spawn();
    }
    draw();
  }

  function rotate() {
    if (over || paused) return;
    const m = piece.shape;
    const R = m.length, C = m[0].length;
    const res = Array.from({ length: C }, () => Array(R).fill(0));
    for (let r = 0; r < R; r++)
      for (let c = 0; c < C; c++)
        res[c][R - 1 - r] = m[r][c];

    // 简单的“踢墙”：左右各试几个位置
    for (const dx of [0, -1, 1, -2, 2]) {
      if (!collide(res, piece.x + dx, piece.y)) {
        piece.shape = res;
        piece.x += dx;
        draw();
        return;
      }
    }
  }

  function hardDrop() {
    if (over || paused) return;
    while (!collide(piece.shape, piece.x, piece.y + 1)) piece.y++;
    merge(); AudioBox.sfx('drop'); clearLines(); spawn(); draw();
  }

  function cell(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, 3);
  }

  function draw() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(255,255,255,.05)';
    for (let c = 1; c < COLS; c++) {
      ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, canvas.height); ctx.stroke();
    }
    for (let r = 1; r < ROWS; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(canvas.width, r * CELL); ctx.stroke();
    }

    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (board[r][c]) cell(c, r, board[r][c]);

    if (piece && !over) {
      piece.shape.forEach((row, r) => row.forEach((v, c) => {
        if (v) cell(piece.x + c, piece.y + r, piece.color);
      }));
    }

    if (over) {
      ctx.fillStyle = 'rgba(0,0,0,.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '15px sans-serif';
      ctx.fillText('得分 ' + score, canvas.width / 2, canvas.height / 2 + 22);
    } else if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('已暂停', canvas.width / 2, canvas.height / 2);
    }
  }

  function key(e) {
    const k = e.key.toLowerCase();
    let handled = true;
    if (k === 'arrowleft' || k === 'a') move(-1);
    else if (k === 'arrowright' || k === 'd') move(1);
    else if (k === 'arrowdown' || k === 's') softDrop();
    else if (k === 'arrowup' || k === 'w') rotate();
    else if (k === ' ') hardDrop();
    else if (k === 'p') { paused = !paused; draw(); }
    else if (k === 'r') reset();
    else handled = false;
    if (handled) e.preventDefault();
  }

  return {
    start() { reset(); },
    stop()  { clearInterval(timer); },
    reset, key, move, rotate, softDrop, hardDrop
  };
})();

document.querySelectorAll('[data-t]').forEach(b => {
  b.addEventListener('click', () => {
    const t = b.dataset.t;
    if (t === 'left')   Tetris.move(-1);
    if (t === 'right')  Tetris.move(1);
    if (t === 'down')   Tetris.softDrop();
    if (t === 'rotate') Tetris.rotate();
    if (t === 'drop')   Tetris.hardDrop();
  });
});
document.getElementById('tetris-restart').addEventListener('click', () => { Tetris.reset(); AudioBox.sfx('click'); });
document.getElementById('tetris-pause').addEventListener('click', () => Tetris.pause());

document.getElementById('music-toggle').addEventListener('click', () => AudioBox.toggleMusic());
document.getElementById('sound-toggle').addEventListener('click', () => AudioBox.toggleSound());
document.getElementById('difficulty').addEventListener('change', () => AudioBox.sfx('click'));

/* ================= 钓鱼电子斗蛐蛐原型 ================= */
const Fishing = (() => {
  const $ = id => document.getElementById(id);
  const species = [
    {id:'minnow',name:'银光小鱼',emoji:'🐟',rarity:'common',base:18,price:12,areas:['pond','river'],bait:['worm','grain']},
    {id:'carp',name:'锦鲤',emoji:'🐠',rarity:'uncommon',base:32,price:25,areas:['pond','river'],bait:['grain','worm']},
    {id:'catfish',name:'大胡子鲶鱼',emoji:'🐡',rarity:'uncommon',base:40,price:32,areas:['river','lake'],bait:['worm','shrimp']},
    {id:'pike',name:'翠刃狗鱼',emoji:'🐟',rarity:'rare',base:48,price:48,areas:['river','lake'],bait:['shrimp']},
    {id:'goldfish',name:'黄金金鱼',emoji:'🐠',rarity:'epic',base:45,price:75,areas:['pond','lake'],bait:['grain','glow']},
    {id:'moon',name:'月影鱼',emoji:'🐟',rarity:'legend',base:65,price:120,areas:['lake'],bait:['glow']}
  ];
  const state = {coins:120,rod:1,line:1,fish:[],cast:false,battle:null,selected:null,area:'pond',bait:'worm',guard:false};
  const rarityNames={common:'普通',uncommon:'优秀',rare:'稀有',epic:'史诗',legend:'传说'};
  const rarityClass=r=>'rarity-'+r;
  function log(msg){const el=$('fish-log');el.innerHTML=msg+'<br>'+el.innerHTML;}
  function save(){try{localStorage.setItem('fishing-proto-save',JSON.stringify({coins:state.coins,rod:state.rod,line:state.line,fish:state.fish}));}catch(e){}}
  function load(){try{const d=JSON.parse(localStorage.getItem('fishing-proto-save')||'null');if(d){state.coins=d.coins??120;state.rod=d.rod??1;state.line=d.line??1;state.fish=d.fish||[];}}catch(e){}}
  function render(){
    $('fish-coins').textContent=state.coins;$('rod-level').textContent='Lv.'+state.rod;$('line-level').textContent='Lv.'+state.line;
    $('rod-cost').textContent=80*state.rod;$('line-cost').textContent=60*state.line;$('fish-count').textContent=state.fish.length;
    $('fish-record').textContent=state.fish.length?Math.max(...state.fish.map(f=>f.length))+' cm':'暂无';
    $('fish-collection').innerHTML=state.fish.slice(-12).reverse().map((f,i)=>`<button class="fish-chip" data-fish-index="${state.fish.length-1-i}"><span class="${rarityClass(f.rarity)}">${f.emoji} ${f.name}</span><br><b>${f.length}cm</b></button>`).join('')||'<span class="hint">还没有鱼，快去钓鱼吧！</span>';
    $('fish-team').innerHTML='<option value="">选择出战鱼</option>'+state.fish.map((f,i)=>`<option value="${i}" ${state.selected===i?'selected':''}>${f.name} · ${f.length}cm · Lv.${f.level||1}</option>`).join('');
    $('fish-cast').disabled=state.cast||!!state.battle;$('fish-reel').disabled=!state.cast;
    $('upgrade-rod').disabled=state.coins<80*state.rod;$('upgrade-line').disabled=state.coins<60*state.line;
  }
  function areaName(){return {pond:'宁静池塘',river:'清澈河流',lake:'星辉湖泊'}[state.area];}
  function chooseCatch(){
    let pool=species.filter(s=>s.areas.includes(state.area));
    const bait=state.bait;pool=pool.filter(s=>s.bait.includes(bait)||bait==='glow');
    const rareBoost=(state.rod-1)*.025+(bait==='glow'?.13:0);
    let weights=pool.map(s=>s.rarity==='common'?55:s.rarity==='uncommon'?25:s.rarity==='rare'?12:s.rarity==='epic'?6:2);
    weights=weights.map((w,i)=>w*(pool[i].rarity==='legend'||pool[i].rarity==='epic'?1+rareBoost:1));
    let r=Math.random()*weights.reduce((a,b)=>a+b,0);
    for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i];}
    return pool[0];
  }
  function cast(){
    if(state.cast||state.battle)return;
    state.area=$('fish-area').value;state.bait=$('fish-bait').value;
    const unlock={pond:0,river:200,lake:650}[state.area];
    if(state.coins<unlock){$('fish-status').textContent='金币不足，暂时无法前往这个区域。';return;}
    if(state.area==='river'&&state.rod<2){$('fish-status').textContent='清澈河流需要 Lv.2 鱼竿才能安全垂钓！';return;}
    if(state.area==='lake'&&state.rod<4){$('fish-status').textContent='星辉湖泊需要 Lv.4 鱼竿才能前往！';return;}
    state.cast=true;$('fish-scene').textContent='🎣 〰️ 🌊';$('fish-status').textContent='鱼线入水了……耐心等待鱼儿咬钩！';
    AudioBox.sfx('click');setTimeout(()=>{
      if(!state.cast)return;
      if(Math.random()<.23){state.cast=false;startBattle();return;}
      const s=chooseCatch();const length=Math.round(s.base*(.65+Math.random()*.55)*(1+(state.rod-1)*.035));
      landFish(s,length);
    },1800+Math.random()*1800);
    render();
  }
  function landFish(s,length){
    state.cast=false;
    const prev=Math.max(0,...state.fish.filter(f=>f.id===s.id).map(f=>f.length));
    const isRecord=length>prev;
    const fish={...s,length,level:1,hp:Math.round(24+length*.65),maxHp:Math.round(24+length*.65),atk:Math.round(5+length*.19),def:Math.round(2+length*.07),speed:Math.round(5+length*.05)};
    state.fish.push(fish);state.selected=state.fish.length-1;
    $('fish-scene').textContent=isRecord?'✨🌟'+s.emoji+'🌟✨':s.emoji;
    $('fish-status').innerHTML=`钓到了 <b class="${rarityClass(s.rarity)}">${rarityNames[s.rarity]} ${s.name}</b>！体长 ${length} cm。`+(isRecord?'<br><b style="color:#c18a25">✨ 品种新纪录！金光闪耀！</b>':'');
    log((isRecord?'✨ 新纪录！':'🎣')+` 获得${s.name}，${length}cm。`);
    AudioBox.sfx(isRecord?'clear':'eat');save();render();
    // A record-sized fish glows; a random fish may also start a battle.
  }
  function startBattle(){
    if(!state.fish.length){$('fish-status').textContent='水面突然出现了凶猛的野生鱼！但你还没有自己的鱼，只能暂时躲避。';$('fish-scene').textContent='🦈💦';log('遭遇野生鱼！先钓到一条鱼，才能组建战队。');return;}
    let idx=Number($('fish-team').value);if(!$('fish-team').value)idx=state.selected??0;
    if(!state.fish[idx])idx=0;state.selected=idx;
    const own=state.fish[idx],wild=species.filter(s=>s.rarity==='rare'||s.rarity==='epic'||s.rarity==='uncommon')[Math.floor(Math.random()*3)];
    const factor=.8+Math.random()*.5;
    state.battle={own,wild:{...wild,hp:Math.round((26+wild.base*.65)*factor),maxHp:Math.round((26+wild.base*.65)*factor),atk:Math.round(6+wild.base*.2),def:Math.round(2+wild.base*.07)},turn:1};
    $('fish-battle-panel').style.display='block';$('battle-status').textContent='野生'+wild.name+'挡住了去路！你的鱼会自动攻击，选择技能支援！';
    $('battle-player-emoji').textContent=own.emoji;$('battle-player-name').textContent=own.name;
    $('battle-wild-emoji').textContent=wild.emoji;$('battle-wild-name').textContent='野生'+wild.name;
    log('⚔️ 遭遇战！'+own.name+' 对战 野生'+wild.name+'！');battleRender();AudioBox.sfx('over');
  }
  function battleRender(){
    const b=state.battle;if(!b)return;
    $('battle-player-hp').textContent=`HP ${Math.max(0,b.own.hp)}/${b.own.maxHp}`;$('battle-wild-hp').textContent=`HP ${Math.max(0,b.wild.hp)}/${b.wild.maxHp}`;
    $('battle-player-hpbar').style.width=Math.max(0,b.own.hp/b.own.maxHp*100)+'%';$('battle-wild-hpbar').style.width=Math.max(0,b.wild.hp/b.wild.maxHp*100)+'%';$('battle-turn').textContent='回合 '+b.turn;
  }
  function battleAction(action){
    const b=state.battle;if(!b)return;
    const own=b.own,w=b.wild;
    let bonus=0;
    if(action==='skill'){bonus=9+own.atk*.65;$('battle-status').textContent=own.name+'使出强力冲击！';}
    else if(action==='guard'){state.guard=true;$('battle-status').textContent=own.name+'进入防御姿态，抵挡下一次攻击。';}
    else if(action==='capture'){if(w.hp<w.maxHp*.35&&Math.random()<.55){log('🫧 成功收服野生'+w.name+'！');const caught={...w,id:w.id,name:w.name,emoji:w.emoji,rarity:w.rarity,length:Math.round(w.base*.8),level:1};state.fish.push(caught);finishBattle(true);return;}else $('battle-status').textContent='收服失败！野生鱼趁机发动攻击！';}
    if(action!=='guard'&&action!=='capture')w.hp-=Math.max(1,own.atk+bonus-w.def);
    if(w.hp<=0){finishBattle(true);return;}
    const damage=Math.max(1,w.atk-own.def-(state.guard?8:0));own.hp-=damage;state.guard=false;
    if(own.hp<=0){finishBattle(false);return;}
    b.turn++;battleRender();AudioBox.sfx(action==='skill'?'clear':'move');
    $('battle-status').textContent+=` 野生鱼反击，造成 ${damage} 点伤害。`;
  }
  function finishBattle(win){
    if(win){state.coins+=35;log('🏆 战斗胜利！获得 35 金币和经验！');$('battle-status').textContent='胜利！获得 35 金币。';}
    else{$('battle-status').textContent='战败了……休整后再来挑战吧。';log('💦 战斗失败，鱼队需要休整。');}
    state.battle=null;save();render();$('fish-battle-panel').dataset.finished='1';
    // Keep result panel visible until next cast; buttons become harmless without an active battle.
  }
  function upgrade(which){
    const cost=(which==='rod'?80*state.rod:60*state.line);
    if(state.coins<cost)return;
    state.coins-=cost;state[which]++;log((which==='rod'?'🎣 鱼竿':'🧵 鱼线')+'升级至 Lv.'+state[which]+'！');AudioBox.sfx('clear');save();render();
  }
  function sell(){
    const idx=Number($('fish-team').value);if(!$('fish-team').value||!state.fish[idx])return;
    const f=state.fish[idx];state.coins+=f.price+Math.floor(f.length/5);state.fish.splice(idx,1);state.selected=state.fish.length?0:null;
    log('🪙 出售'+f.name+'，获得金币。');save();render();
  }
  function heal(){state.fish.forEach(f=>f.hp=f.maxHp);log('💚 鱼队已经恢复状态！');render();}
  function init(){
    load();render();
    $('fish-cast').addEventListener('click',cast);
    $('fish-reel').addEventListener('click',()=>{if(state.cast){state.cast=false;landFish(chooseCatch(),Math.round(20+Math.random()*15));}});
    $('upgrade-rod').addEventListener('click',()=>upgrade('rod'));$('upgrade-line').addEventListener('click',()=>upgrade('line'));
    $('fish-sell').addEventListener('click',sell);$('fish-heal').addEventListener('click',heal);
    $('fish-team').addEventListener('change',()=>{state.selected=Number($('fish-team').value);});
    $('battle-skill').addEventListener('click',()=>battleAction('skill'));$('battle-guard').addEventListener('click',()=>battleAction('guard'));$('battle-capture').addEventListener('click',()=>battleAction('capture'));
    $('fish-collection').addEventListener('click',e=>{const b=e.target.closest('[data-fish-index]');if(b){state.selected=Number(b.dataset.fishIndex);$('fish-team').value=String(state.selected);}});
  }
  return {init};
})();
