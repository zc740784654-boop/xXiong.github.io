<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的名片</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .intro {
      color: #555;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      text-decoration: none;
      color: #667eea;
      border: 1px solid #667eea;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      transition: all 0.2s;
    }

    .links a:hover {
      background: #667eea;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">X</div>
    <h1>你的名字</h1>
    <p class="subtitle">前端爱好者 · 学生 · 开发者</p>
    <p class="intro">
      你好，欢迎来到我的主页。这里是我的个人名片，正在学习网页开发，
      喜欢用代码做一些有趣的小东西。
    </p>
    <div class="links">
      <a href="https://github.com/">GitHub</a>
      <a href="mailto:you@example.com">邮箱</a>
    </div>
  </div>
</body>
</html>
