<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熊传芝</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
  }
  .view { display: none; }
  .view.active { display: block; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 36px 30px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, .2);
  }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; font-size: 36px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  h1 { font-size: 23px; color: #333; margin-bottom: 8px; }
  .subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
  .intro { color: #555; font-size: 15px; line-height: 1.7; margin-bottom: 24px; }
  .games { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
  .btn {
    border: none; cursor: pointer; font-size: 15px;
    padding: 11px 20px; border-radius: 999px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; font-family: inherit;
    transition: transform .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(102,126,234,.4); }
  .btn.ghost { background: #fff; color: #667eea; border: 1px solid #667eea; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .links a {
    text-decoration: none; color: #667eea; border: 1px solid #667eea;
    padding: 8px 18px; border-radius: 999px; font-size: 14px; transition: all .2s;
  }
  .links a:hover { background: #667eea; color: #fff; }

  .game-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; gap: 8px;
  }
  .game-head .title { font-weight: 600; color: #333; font-size: 16px; white-space: nowrap; }
  .score { color: #667eea; font-weight: 600; font-size: 14px; white-space: nowrap; }
  canvas { display: block; margin: 0 auto; background: #111; border-radius: 10px; touch-action: none; }
  #snake-canvas { width: min(100%, 340px); height: auto; }
  #tetris-canvas { width: min(100%, 220px); height: auto; }
  .hint { font-size: 13px; color: #999; margin: 14px 0; line-height: 1.6; }
  .pad {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; max-width: 240px; margin: 0 auto;
  }
  .pad button {
    padding: 14px 0; border: none; border-radius: 10px;
    background: #f0f0f5; color: #444; font-size: 18px;
    cursor: pointer; font-family: inherit; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .pad button:active { background: #ddd; }
  .pad .wide { grid-column: span 3; font-size: 15px; }
  .mt { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
</style>
</head>
<body>

<!-- ========== 主页 ========== -->
<div id="view-home" class="view active">
  <div class="card">
    <div class="avatar">X</div>
    <h1>熊传芝</h1>
    <p class="subtitle">前端爱好者 · 学生 · 开发者</p>
    <p class="intro">
      你好，欢迎来到我的主页。这里是我的个人名片，
      喜欢用代码做一些有趣的小东西。
    </p>
    <div class="games">
      <button class="btn" data-game="snake">🐍 贪吃蛇</button>
      <button class="btn" data-game="tetris">🧱 俄罗斯方块</button>
    </div>
    <div class="links">
      <a href="https://github.com/zc740784654-boop/">GitHub</a>
      <a href="mailto:you@example.com">邮箱</a>
    </div>
  </div>
</div>

<!-- ========== 贪吃蛇 ========== -->
<div id="view-snake" class="view">
  <div class="card">
    <div class="game-head">
      <button class="btn ghost" data-back>← 返回</button>
      <span class="title">🐍 贪吃蛇</span>
      <span class="score">得分 <b id="snake-score">0</b></span>
    </div>
    <canvas id="snake-canvas" width="400" height="400"></canvas>
    <p class="hint">电脑：方向键 / WASD 控制方向<br>手机：点下方按钮</p>
    <div class="pad">
      <span></span>
      <button data-dir="up">↑</button>
      <span></span>
      <button data-dir="left">←</button>
      <button data-dir="down">↓</button>
      <button data-dir="right">→</button>
    </div>
    <div class="mt"><button class="btn" id="snake-restart">重新开始</button></div>
  </div>
</div>

<!-- ========== 俄罗斯方块 ========== -->
<div id="view-tetris" class="view">
  <div class="card">
    <div class="game-head">
      <button class="btn ghost" data-back>← 返回</button>
      <span class="title">🧱 俄罗斯方块</span>
      <span class="score">得分 <b id="tetris-score">0</b></span>
    </div>
    <canvas id="tetris-canvas" width="240" height="480"></canvas>
    <p class="hint">← → 移动 · ↑ 旋转 · ↓ 加速 · 空格 直接落下</p>
    <div class="pad">
      <button data-t="left">←</button>
      <button data-t="rotate">⟳</button>
      <button data-t="right">→</button>
      <button data-t="down">↓</button>
      <button data-t="drop" class="wide">⤓ 直接落下</button>
    </div>
    <div class="mt"><button class="btn" id="tetris-restart">重新开始</button></div>
  </div>
</div>

<script>
/* ================= 视图切换 ================= */
let currentView = 'home';

function showView(name) {
  if (currentView === 'snake')  Snake.stop();
  if (currentView === 'tetris') Tetris.stop();

  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  currentView = name;

  if (name === 'snake')  Snake.start();
  if (name === 'tetris') Tetris.start();
  window.scrollTo(0, 0);
}

document.querySelectorAll('[data-game]').forEach(b =>
  b.addEventListener('click', () => showView(b.dataset.game)));
document.querySelectorAll('[data-back]').forEach(b =>
  b.addEventListener('click', () => showView('home')));

/* ================= 贪吃蛇 ================= */
const Snake = (() => {
  const canvas = document.getElementById('snake-canvas');
  const ctx = canvas.getContext('2d');
  const N = 20;
  const CELL = canvas.width / N;
  const scoreEl = document.getElementById('snake-score');

  let snake, dir, nextDir, food, score, timer, over;

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    over = false;
    scoreEl.textContent = '0';
    placeFood();
    clearInterval(timer);
    timer = setInterval(step, 130);
    draw();
  }

  function placeFood() {
    let ok = false;
    while (!ok) {
      food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
      ok = !snake.some(s => s.x === food.x && s.y === food.y);
    }
  }

  function step() {
    if (over) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      over = true;
      clearInterval(timer);
      draw();
      return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(255,255,255,.04)';
    for (let i = 1; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // 食物
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // 蛇
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#9ae6b4' : '#4ade80';
      roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 4);
      ctx.fill();
    });

    if (over) {
      ctx.fillStyle = 'rgba(0,0,0,.65)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '16px sans-serif';
      ctx.fillText('得分 ' + score, canvas.width / 2, canvas.height / 2 + 24);
    }
  }

  function turn(nx, ny) {
    if (over) return;
    if (nx === -dir.x && ny === -dir.y) return; // 不能直接掉头
    nextDir = { x: nx, y: ny };
  }

  function key(e) {
    const k = e.key.toLowerCase();
    let handled = true;
    if (k === 'arrowup' || k === 'w') turn(0, -1);
    else if (k === 'arrowdown' || k === 's') turn(0, 1);
    else if (k === 'arrowleft' || k === 'a') turn(-1, 0);
    else if (k === 'arrowright' || k === 'd') turn(1, 0);
    else if (k === 'r') reset();
    else handled = false;
    if (handled) e.preventDefault();
  }

  return {
    start() { reset(); },
    stop()  { clearInterval(timer); },
    reset, key, turn
  };
})();

document.querySelectorAll('[data-dir]').forEach(b => {
  b.addEventListener('click', () => {
    const d = b.dataset.dir;
    if (d === 'up')    Snake.turn(0, -1);
    if (d === 'down')  Snake.turn(0, 1);
    if (d === 'left')  Snake.turn(-1, 0);
    if (d === 'right') Snake.turn(1, 0);
  });
});
document.getElementById('snake-restart').addEventListener('click', () => Snake.reset());

/* ================= 俄罗斯方块 ================= */
const Tetris = (() => {
  const canvas = document.getElementById('tetris-canvas');
  const ctx = canvas.getContext('2d');
  const COLS = 10, ROWS = 20;
  const CELL = canvas.width / COLS;
  const scoreEl = document.getElementById('tetris-score');

  const PIECES = [
    { shape: [[1,1,1,1]],          color: '#4dd0e1' }, // I
    { shape: [[1,1],[1,1]],        color: '#ffd54f' }, // O
    { shape: [[0,1,0],[1,1,1]],    color: '#ba68c8' }, // T
    { shape: [[0,1,1],[1,1,0]],    color: '#81c784' }, // S
    { shape: [[1,1,0],[0,1,1]],    color: '#e57373' }, // Z
    { shape: [[1,0,0],[1,1,1]],    color: '#64b5f6' }, // J
    { shape: [[0,0,1],[1,1,1]],    color: '#ffb74d' }  // L
  ];

  let board, piece, score, lines, level, over, paused, timer;

  function newBoard() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  }

  function speed() {
    return Math.max(140, 600 - (level - 1) * 55);
  }

  function schedule() {
    clearInterval(timer);
    timer = setInterval(tick, speed());
  }

  function reset() {
    board = newBoard();
    score = 0; lines = 0; level = 1;
    over = false; paused = false;
    scoreEl.textContent = '0';
    spawn();
    schedule();
    draw();
  }

  function spawn() {
    const p = PIECES[Math.floor(Math.random() * PIECES.length)];
    piece = {
      shape: p.shape.map(r => r.slice()),
      color: p.color,
      x: Math.floor((COLS - p.shape[0].length) / 2),
      y: 0
    };
    if (collide(piece.shape, piece.x, piece.y)) {
      over = true;
      clearInterval(timer);
    }
  }

  function collide(shape, px, py) {
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (!shape[r][c]) continue;
        const x = px + c, y = py + r;
        if (x < 0 || x >= COLS || y >= ROWS) return true;
        if (y >= 0 && board[y][x]) return true;
      }
    }
    return false;
  }

  function merge() {
    piece.shape.forEach((row, r) => row.forEach((v, c) => {
      if (v) {
        const y = piece.y + r, x = piece.x + c;
        if (y >= 0) board[y][x] = piece.color;
      }
    }));
  }

  function clearLines() {
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r].every(v => v)) {
        board.splice(r, 1);
        board.unshift(Array(COLS).fill(0));
        cleared++;
        r++; // 重新检查同一行
      }
    }
    if (cleared) {
      const pts = [0, 100, 300, 500, 800][cleared] || 800;
      score += pts;
      lines += cleared;
      const nl = Math.floor(lines / 10) + 1;
      if (nl > level) { level = nl; schedule(); }
      scoreEl.textContent = score;
    }
  }

  function tick() {
    if (over || paused) return;
    if (!collide(piece.shape, piece.x, piece.y + 1)) {
      piece.y++;
    } else {
      merge(); clearLines(); spawn();
    }
    draw();
  }

  function move(dx) {
    if (over || paused) return;
    if (!collide(piece.shape, piece.x + dx, piece.y)) {
      piece.x += dx;
      draw();
    }
  }

  function softDrop() {
    if (over || paused) return;
    if (!collide(piece.shape, piece.x, piece.y + 1)) {
      piece.y++;
    } else {
      merge(); clearLines(); spawn();
    }
    draw();
  }

  function rotate() {
    if (over || paused) return;
    const m = piece.shape;
    const R = m.length, C = m[0].length;
    const res = Array.from({ length: C }, () => Array(R).fill(0));
    for (let r = 0; r < R; r++)
      for (let c = 0; c < C; c++)
        res[c][R - 1 - r] = m[r][c];

    // 简单的“踢墙”：左右各试几个位置
    for (const dx of [0, -1, 1, -2, 2]) {
      if (!collide(res, piece.x + dx, piece.y)) {
        piece.shape = res;
        piece.x += dx;
        draw();
        return;
      }
    }
  }

  function hardDrop() {
    if (over || paused) return;
    while (!collide(piece.shape, piece.x, piece.y + 1)) piece.y++;
    merge(); clearLines(); spawn(); draw();
  }

  function cell(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, 3);
  }

  function draw() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(255,255,255,.05)';
    for (let c = 1; c < COLS; c++) {
      ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, canvas.height); ctx.stroke();
    }
    for (let r = 1; r < ROWS; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(canvas.width, r * CELL); ctx.stroke();
    }

    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (board[r][c]) cell(c, r, board[r][c]);

    if (piece && !over) {
      piece.shape.forEach((row, r) => row.forEach((v, c) => {
        if (v) cell(piece.x + c, piece.y + r, piece.color);
      }));
    }

    if (over) {
      ctx.fillStyle = 'rgba(0,0,0,.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '15px sans-serif';
      ctx.fillText('得分 ' + score, canvas.width / 2, canvas.height / 2 + 22);
    } else if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('已暂停', canvas.width / 2, canvas.height / 2);
    }
  }

  function key(e) {
    const k = e.key.toLowerCase();
    let handled = true;
    if (k === 'arrowleft' || k === 'a') move(-1);
    else if (k === 'arrowright' || k === 'd') move(1);
    else if (k === 'arrowdown' || k === 's') softDrop();
    else if (k === 'arrowup' || k === 'w') rotate();
    else if (k === ' ') hardDrop();
    else if (k === 'p') { paused = !paused; draw(); }
    else if (k === 'r') reset();
    else handled = false;
    if (handled) e.preventDefault();
  }

  return {
    start() { reset(); },
    stop()  { clearInterval(timer); },
    reset, key, move, rotate, softDrop, hardDrop
  };
})();

document.querySelectorAll('[data-t]').forEach(b => {
  b.addEventListener('click', () => {
    const t = b.dataset.t;
    if (t === 'left')   Tetris.move(-1);
    if (t === 'right')  Tetris.move(1);
    if (t === 'down')   Tetris.softDrop();
    if (t === 'rotate') Tetris.rotate();
    if (t === 'drop')   Tetris.hardDrop();
  });
});
document.getElementById('tetris-restart').addEventListener('click', () => Tetris.reset());

/* ================= 全局键盘 ================= */
document.addEventListener('keydown', e => {
  if (currentView === 'snake')  Snake.key(e);
  if (currentView === 'tetris') Tetris.key(e);
});
</script>
</body>
</html>
